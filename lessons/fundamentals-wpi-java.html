<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRCTeach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css"/>
  </head>
  <body>
    <div id="header"></div>
    <main class="page-content" id="lesson-content">
      <div class="page">
        <h2>Page 1: Intro</h2>
        <p>Welcome to the lesson...</p>
        <div id="code-editor-1"></div>
      </div>

      <div class="page">
        <h2>Page 2: Basic Structure</h2>
        <p>Every WPILib robot program extends TimedRobot...</p>
        <div id="code-editor"></div>
      </div>

      <div class="page">
        <h2>Page 3: Quiz</h2>
        <div id="quiz-container"></div>
      </div>

    </main>

    <script type="module">
      import { CodeEditor, CodeEditorQuiz, PageNav, Quiz } from '../js/components.js';

      PageNav({ containerId: 'lesson-content' });

      Quiz({
        containerId: 'quiz-container',
        questions: [
          { question: "Test", options: ["1", "2", "3"], answer: 0 }
        ]
      });

      CodeEditor({
        starterCode: 'public class Robot extends TimedRobot {\n  // ...\n}',
        containerId: 'code-editor'
      });
      CodeEditorQuiz({
        starterCode: '',
        answerCode: '//comment',
        containerId: 'code-editor-1'
        
      });
    </script>
  </body>
</html>
